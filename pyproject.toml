[project]
name = "Training"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Louis903995", email = "louis@moises.fr"},
]
dependencies = ["pandas>=2.3.1", "scikit-learn>=1.7.1", "skl2onnx>=1.19.1", "onnxruntime>=1.22.1", "pyarrow>=21.0.0"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
test = [
    "pytest>=8.4.1",
    "pydantic>=2.11.7",
]
lint = [
    "ruff>=0.12.7",
]
